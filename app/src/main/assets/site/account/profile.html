<!DOCTYPE html>
<html lang="ru">

<main class="main">
    <section>
        <h1>Профиль<br><span class="acc">Amore</span></h1>

        <div class="meta">

    <section class="card card-profile" aria-label="Профиль">

            <div class="pavatar" id="av">A</div>
            <div class="pmeta">
                <h2 id="pnick">…</h2>
                <div class="prow-line">

                    <span class="dim" id="pts"></span>
                </div>
                <p class="pslug" id="pslug">загрузка…</p>

        </div>
        <div class="pactions" id="pactions">
