<script>
/* Шрифты подключаем ПОСЛЕ старта приложения. Firefox блокирует выполнение
   скриптов, пока не загрузится внешний stylesheet из <head>: если
   fonts.googleapis.com недоступен, запуск откладывался на ~10 секунд. */
(function(){
  var href='https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;700&family=Caveat:wght@600;700&display=swap';
  function add(){
    var l=document.createElement('link');
    l.rel='stylesheet'; l.href=href;
    document.head.appendChild(l);
  }
  if(document.readyState==='complete') add();
  else addEventListener('load', add, {once:true});
})();
</script>
